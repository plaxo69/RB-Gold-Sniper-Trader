name: Deploy RB TRADER PRO to Cloudflare

on:
  push:
    branches:
      - migration-cloudflare-2026-10-11
    paths:
      - 'worker.js'
      - 'public/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/deploy-cloudflare-migration.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Validate Cloudflare bundle
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Deploy Cloudflare Worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
