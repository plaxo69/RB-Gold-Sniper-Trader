name: Deploy to Cloudflare Workers

# Cloudflare production deploys are validated and published by
# .github/workflows/deploy-cloudflare-migration.yml on the migration branch.
# This legacy main-branch workflow is intentionally manual-only: main does not
# contain worker.js or wrangler.jsonc, and must not run a Cloudflare deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled-legacy-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment route
        run: |
          echo "No deployment performed from main."
          echo "Use the validated Cloudflare workflow on migration-cloudflare-2026-10-11."
