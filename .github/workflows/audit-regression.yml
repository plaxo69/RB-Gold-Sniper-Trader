name: Audit regression checks
on:
  pull_request:
    branches:
      - migration-cloudflare-2026-10-11
  push:
    branches:
      - audit-fixes-2026-10-15
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm test
