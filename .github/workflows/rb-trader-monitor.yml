name: RB TRADER PRO — health check Cloudflare

on:
  schedule:
    - cron: "2-59/5 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar API de produção no Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS --retry 2 --retry-delay 3 --max-time 20 https://rb-gold-sniper-trader.plaxo69.workers.dev/api/health)"
          printf '%s\n' "$RESPONSE"
          printf '%s' "$RESPONSE" | python -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("status") == "OK" and d.get("marketConnected") is True else 1)'
