name: RB TRADER PRO — health check Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rb-trader-monitor.yml'
  schedule:
    - cron: "2-59/5 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verificar API de produção no Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl -sS --retry 2 --retry-delay 3 --max-time 20 \
            -o "$body_file" -w '%{http_code}' \
            https://rb-gold-sniper-trader.plaxo69.workers.dev/api/health)"
          echo "HTTP status: $status"
          cat "$body_file"
          if [[ "$status" != "200" ]]; then
            echo "Health endpoint returned HTTP $status" >&2
            exit 1
          fi
          python - "$body_file" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              data = json.load(f)
          if data.get('status') != 'OK' or data.get('marketConnected') is not True:
              print('Health payload reports a degraded market feed.', file=sys.stderr)
              sys.exit(1)
          PY
