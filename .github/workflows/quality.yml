name: RB Trader PRO — Quality Gate

on:
  pull_request:
    branches:
      - migration-cloudflare-2026-10-11
  push:
    branches:
      - fix/plano-correcao-integral-2026-11-03
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify JavaScript syntax
        run: npm run build
      - name: Run regression tests
        run: npm test
