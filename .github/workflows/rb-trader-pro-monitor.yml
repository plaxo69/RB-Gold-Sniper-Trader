name: RB TRADER PRO — Monitor de mercado e alertas
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: rb-trader-pro-market-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Executar monitor de produção com identidade OIDC
        shell: bash
        env:
          MONITOR_URL: https://rb-gold-sniper-trader.vercel.app/api/monitor
        run: |
          set -euo pipefail
          token_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frb-gold-sniper-trader.vercel.app%2Fapi%2Fmonitor")"
          id_token="$(printf '%s' "$token_response" | jq -er '.value')"
          curl --fail-with-body --silent --show-error --max-time 90 \
            -X POST \
            -H "Authorization: Bearer $id_token" \
            -H "Content-Type: application/json" \
            "$MONITOR_URL"
